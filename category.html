<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <title>WALLIX | Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      font-family: 'Comfortaa', sans-serif;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #000;
      color: #fff;
      min-height: 100vh;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #2c2c2c;
      border-radius: 50px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgb(255, 0, 0);
      border-radius: 50px;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgb(255, 0, 0);
      padding: 15px;
      margin: 16px;
      margin-bottom: 0;
    }

    .logo {
      height: 50px;
      border-radius: 50%;
    }

    .back-btn {
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      border: 1px solid #fff;
      padding: 8px 16px;
      border-radius: 5px;
      transition: background 0.3s, color 0.3s;
    }

    .back-btn:hover {
      background: #fff;
      color: rgb(255, 0, 0);
    }

    .category-header {
      text-align: center;
      margin: 40px 0 20px;
    }

    .category-title {
      font-size: 3.5rem;
      text-transform: uppercase;
      background-image: linear-gradient(rgb(255, 0, 0), rgb(255, 0, 64));
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 4px 4px 20px rgba(255, 0, 0, 0.486);
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
      margin: 0 auto;
      max-width: 1400px;
      gap: 20px;
    }

    .box {
      flex: 1 1 280px;
      max-width: 380px;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.25);
      cursor: pointer;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .box:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
      z-index: 2;
    }

    .box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .download-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .box:hover .download-overlay {
      opacity: 1;
    }

    .download-btn {
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      background: rgb(255, 0, 0);
      padding: 8px 16px;
      border-radius: 5px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <img src="./logo.png" alt="Wallix Logo" class="logo" />
    <a href="index.html" class="back-btn"><i class="fa fa-arrow-left"></i> Back to Categories</a>
  </nav>

    const params = new URLSearchParams(window.location.search);
    const selectedType = (params.get('type') || 'cars').toLowerCase();

    document.getElementById('cat-title').textContent = selectedType + " wallpapers";

    const container = document.getElementById('gallery-container');
    const images = categoryData[selectedType] || categoryData['cars'];

    images.forEach((baseUrl, index) => {
      const box = document.createElement('div');
      box.className = 'box';
      box.innerHTML = `
        <img src="${baseUrl}?auto=format&fit=crop&w=400&q=50&fm=webp" 
             alt="${selectedType} Wallpaper ${index + 1}" 
             loading="lazy" 
             decoding="async"
             onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=400&q=50&fm=webp';" />
        <div class="download-overlay">
          <span class="download-btn"><i class="fa fa-download"></i> Download 4K</span>
        </div>
      `;
      
      box.addEventListener('click', () => downloadWallpaper(baseUrl, `${selectedType}-wallpaper-${index + 1}`));
      container.appendChild(box);
    });

    async function downloadWallpaper(baseUrl, fileName) {
      const highResUrl = `${baseUrl}?auto=format&fit=crop&w=1920&q=90`;
      try {
        const response = await fetch(highResUrl);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = `${fileName}.jpg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(blobUrl);
      } catch (err) {
        window.open(highResUrl, '_blank');
      }
    }
